name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [roadmap](https://github.com/romainrg/Mopster#roadmap) and the [existing issues](https://github.com/romainrg/Mopster/issues) first.
        New cleanup rules have their own template: use *Cleanup rule*.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Mopster to do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Could this remove or change something the user did not see and select? How would it stay reversible (Trash, confirmation)?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes"
        - "Maybe, with some guidance"
        - "No"
